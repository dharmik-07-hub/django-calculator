<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Django Full-Stack Calculator</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 30px;
            padding: 50px;
        }
        .calculator, .history-box {
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            width: 320px;
        }
        input[type="text"] {
            width: 100%;
            height: 50px;
            font-size: 22px;
            text-align: right;
            margin-bottom: 15px;
            padding: 5px 10px;
            box-sizing: border-box;
            border: 2px solid #ddd;
            border-radius: 8px;
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        button {
            padding: 15px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            background: #e9ecef;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover { background: #dee2e6; }
        .operator { background: #ff9f43; color: white; }
        .operator:hover { background: #ee8e32; }
        .equal { background: #28a745; color: white; grid-column: span 2; }
        .equal:hover { background: #218838; }
        .clear { background: #dc3545; color: white; grid-column: span 2; }
        .clear:hover { background: #c82333; }
        .history-item {
            padding: 8px 0;
            border-bottom: 1px solid #eee;
            font-size: 15px;
        }
        .clear-hist-btn {
            width: 100%;
            margin-top: 15px;
            background: #6c757d;
            color: white;
            padding: 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="calculator">
        <h2>Calculator</h2>
        <form method="POST">
            {% csrf_token %}
            <input type="text" id="display" name="expression" value="{{ result|default:expression }}" readonly>
            <div class="buttons">
                <button type="button" class="clear" onclick="clearDisplay()">C</button>
                <button type="button" class="operator" onclick="appendValue('/')">/</button>
                <button type="button" class="operator" onclick="appendValue('*')">*</button>

                <button type="button" onclick="appendValue('7')">7</button>
                <button type="button" onclick="appendValue('8')">8</button>
                <button type="button" onclick="appendValue('9')">9</button>
                <button type="button" class="operator" onclick="appendValue('-')">-</button>

                <button type="button" onclick="appendValue('4')">4</button>
                <button type="button" onclick="appendValue('5')">5</button>
                <button type="button" onclick="appendValue('6')">6</button>
                <button type="button" class="operator" onclick="appendValue('+')">+</button>

                <button type="button" onclick="appendValue('1')">1</button>
                <button type="button" onclick="appendValue('2')">2</button>
                <button type="button" onclick="appendValue('3')">3</button>
                <button type="button" onclick="appendValue('.')">.</button>

                <button type="button" onclick="appendValue('0')">0</button>
                <button type="submit" class="equal">=</button>
            </div>
        </form>
    </div>

    <div class="history-box">
        <h2>History</h2>
        {% if history %}
            {% for item in history %}
                <div class="history-item">
                    <strong>{{ item.expression }}</strong> = {{ item.result }}
                </div>
            {% endfor %}
            <form method="POST">
                {% csrf_token %}
                <button type="submit" name="clear_history" class="clear-hist-btn">Clear History</button>
            </form>
        {% else %}
            <p>No calculations yet.</p>
        {% endif %}
    </div>

    <script>
        function appendValue(val) {
            const display = document.getElementById('display');
            if (display.value === "Error" || display.value === "Invalid Input") {
                display.value = "";
            }
            display.value += val;
        }
        function clearDisplay() {
            document.getElementById('display').value = "";
        }
    </script>

</body>
</html>
